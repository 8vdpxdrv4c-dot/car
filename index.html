function enhanceMaterials(root){
  /* CarConcept already has high-end PBR; lightly boost paint clearcoat/env for silver gloss */
  root.traverse(obj => {
    if (!obj.isMesh) return;
    obj.castShadow = true;
    obj.receiveShadow = true;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const mat of mats) {
      if (!mat) continue;
      const n = (mat.name || '').toLowerCase();
      if (n.includes('paint')) {
        mat.envMapIntensity = Math.max(mat.envMapIntensity || 1, 1.6);
        if ('clearcoat' in mat) {
          mat.clearcoat = Math.max(mat.clearcoat || 0, 1.0);
          mat.clearcoatRoughness = Math.min(mat.clearcoatRoughness ?? 0.1, 0.06);
        }
        if ('roughness' in mat) mat.roughness = Math.min(mat.roughness ?? 0.3, 0.22);
        if ('metalness' in mat) mat.metalness = Math.max(mat.metalness || 0, 0.85);
      } else if (n.includes('glass')) {
        mat.envMapIntensity = Math.max(mat.envMapIntensity || 1, 2.0);
        if ('roughness' in mat) mat.roughness = Math.min(mat.roughness ?? 0.1, 0.05);
      } else if (n.includes('rim') || n.includes('hardware') || n.includes('mirror')) {
        mat.envMapIntensity = Math.max(mat.envMapIntensity || 1, 1.5);
        if ('metalness' in mat) mat.metalness = Math.max(mat.metalness || 0, 0.9);
        if ('roughness' in mat) mat.roughness = Math.min(mat.roughness ?? 0.3, 0.15);
      } else if (n.includes('tire')) {
        if (!mat.map && treadMap) {
          mat.map = treadMap.clone();
          mat.map.wrapS = mat.map.wrapT = THREE.RepeatWrapping;
          mat.map.repeat.set(4, 1);
          mat.needsUpdate = true;
        }
        mat.roughness = Math.max(mat.roughness || 0.5, 0.8);
      } else if (n.includes('headlight') || n.includes('brakelight') || n.includes('signallight')) {
        if (!mat.emissive) mat.emissive = new THREE.Color(0xffffff);
        mat.emissiveIntensity = Math.max(mat.emissiveIntensity || 0, n.includes('brake') ? 1.8 : 1.2);
      }
    }
  });
}

async function applyGraphiteVariant(gltf) {
  /* Torched Graphite (variant index 2) — modern metallic silver/graphite */
  const parser = gltf.parser;
  const paint1 = await parser.getDependency('material', 23); // Paint 1 Graphite
  const paint2 = await parser.getDependency('material', 25); // Paint 2 Graphite
  const interior3 = await parser.getDependency('material', 27); // Interior 3 Graphite
  gltf.scene.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    const n = obj.material.name || '';
    if (n.includes('Paint 1')) obj.material = paint1;
    else if (n.includes('Paint 2')) obj.material = paint2;
    else if (n.includes('Interior 3')) obj.material = interior3;
  });
}

async function loadCar(){
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync('./vendor/car/CarConcept.glb');
  const model = gltf.scene;
  await applyGraphiteVariant(gltf);
  enhanceMaterials(model);

  // Model: Y-up, nose toward -Z, left = +X. Rotate -90° Y so nose → +X, left → +Z (outer shoulder).
  const orient = new THREE.Group();
  orient.name = 'carOrient';
  orient.rotation.y = -Math.PI / 2;
  orient.add(model);
  bodyLift.add(orient);
  carApi.orient = orient;
  model.updateMatrixWorld(true);

  // Ground the car (wheels sit on y=0)
  {
    const box = new THREE.Box3().setFromObject(orient);
    orient.position.y -= box.min.y;
  }

  // Collect lamps
  model.traverse(obj => {
    const n = obj.name || '';
    if (/Taillight|Turnsignal|Brakelight/i.test(n)) {
      obj.traverse(c => { if (c.isMesh && !carApi.tailLamps.includes(c)) carApi.tailLamps.push(c); });
      if (obj.isMesh && !carApi.tailLamps.includes(obj)) carApi.tailLamps.push(obj);
    }
    if (/Headlight/i.test(n)) {
      obj.traverse(c => { if (c.isMesh && !carApi.headLamps.includes(c)) carApi.headLamps.push(c); });
      if (obj.isMesh && !carApi.headLamps.includes(obj)) carApi.headLamps.push(obj);
    }
  });

  // Detachable rear-left wheel group (roadside after orientation)
  let wheelRL = null;
  model.traverse(obj => { if (obj.name === 'WheelRearL') wheelRL = obj; });
  const rlGroup = new THREE.Group();
  rlGroup.name = 'RL_wheel';
  orient.add(rlGroup);
  if (wheelRL) {
    rlGroup.attach(wheelRL);
  }
  carApi.rlWheelGroup = rlGroup;

  // Hub position in orient space
  const hubWorld = new THREE.Vector3();
  if (wheelRL) {
    wheelRL.getWorldPosition(hubWorld);
    orient.worldToLocal(hubWorld);
  } else {
    hubWorld.set(0.98, 0.38, 1.31); // fallback local before orient — unused
  }
  carApi.rlLocal.copy(hubWorld);
  carApi.wheelY = hubWorld.y;

  // Pinch weld near left rocker / rear
  const pinch = box(0.45, 0.04, 0.06,
    new THREE.MeshStandardMaterial({ color:0xc9d0d8, roughness:0.3, metalness:0.75 }),
    hubWorld.x * 0.85, Math.max(0.22, hubWorld.y - 0.12), hubWorld.z * 0.75, orient);
  carApi.pinch = pinch;

  const hubStay = new THREE.Group();
  orient.add(hubStay);
  hubStay.position.copy(hubWorld);
  cyl(0.09,0.09,0.06, new THREE.MeshStandardMaterial({color:0xb0b6be, roughness:0.25, metalness:0.9}), 0,0,0, hubStay, 16).rotation.z = Math.PI/2;
  for (let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const s=cyl(0.014,0.014,0.055, new THREE.MeshStandardMaterial({color:0xd0d4d8, metalness:0.9, roughness:0.2}), 0.03, Math.cos(a)*0.1, Math.sin(a)*0.1, hubStay, 8);
    s.rotation.z = Math.PI/2;
  }
  hubStay.visible = false;
  carApi.hubStay = hubStay;

  // License plate → exact www.3Dfans.site (hide Khronos decal)
  model.traverse(obj => {
    const n = obj.name || '';
    if (/license/i.test(n)) {
      obj.traverse(c => {
        if (c.isMesh) {
          c.material = M.plate.clone();
          c.material.polygonOffset = true;
          c.material.polygonOffsetFactor = -1;
          carApi.plates.push(c);
        }
      });
      if (obj.isMesh) {
        obj.material = M.plate.clone();
        carApi.plates.push(obj);
      }
    }
  });
  // Large readable overlays front + rear in model space (nose -Z, rear +Z)
  function addReadablePlate(zSign){
    const g = new THREE.Group();
    const plate = box(0.55, 0.15, 0.025, M.plate.clone(), 0, 0, 0.02, g, false);
    box(0.58, 0.17, 0.015, new THREE.MeshStandardMaterial({color:0xb0b8c0, metalness:0.9, roughness:0.2}), 0,0,0, g, false);
    model.add(g);
    const box3 = new THREE.Box3().setFromObject(model);
    const z = zSign < 0 ? box3.min.z + 0.02 : box3.max.z - 0.02;
    const y = box3.min.y + 0.48;
    g.position.set(0, y, z);
    if (zSign > 0) g.rotation.y = Math.PI;
    carApi.plates.push(plate);
  }
  addReadablePlate(-1);
  addReadablePlate(1);

  dressModernSedan(orient, model);
  carApi.ready = true;
  window.__carApi = carApi;
  window.__gltf = gltf;
  return model;
}

function applyStep(n){
  const s = Math.max(0, Math.min(9, n|0));
  Object.assign(target, { step:s, lift:0, jackH:0, jackUnder:0, flatOff:0, spareOn:0, chockIn:0, toolsOut:0, nutsLoose:0, nutsOff:0, wrenchAt:0, haz:0 });
  if (s >= 0) { target.haz=1; target.chockIn=1; }
  if (s >= 1) { target.toolsOut=1; }
  if (s >= 2) { target.nutsLoose=1; target.wrenchAt=1; }
  if (s >= 3) { target.jackUnder=1; target.wrenchAt=0.25; }
  if (s >= 4) { target.jackUnder=1; target.jackH=1; target.lift=1; target.wrenchAt=0.2; }
  if (s >= 5) { target.jackUnder=1; target.jackH=1; target.lift=1; target.nutsOff=1; target.flatOff=1; }
  if (s >= 6) { target.jackUnder=1; target.jackH=1; target.lift=1; target.spareOn=1; target.flatOff=1; target.nutsLoose=1; target.nutsOff=0; }
  if (s >= 7) { target.lift=0; target.jackH=0; target.jackUnder=0; target.spareOn=1; target.flatOff=1; target.nutsLoose=1; target.toolsOut=1; }
  if (s >= 8) { target.spareOn=1; target.flatOff=1; target.nutsLoose=0; target.wrenchAt=1; target.toolsOut=1; }
  if (s >= 9) { target.spareOn=1; target.flatOff=1; target.toolsOut=0; target.wrenchAt=0; target.chockIn=0; target.haz=0; }
  pose.step = s;
  const cams = [
    [6.5,1.85,6.8, 0.5,0.65,3.6],
    [-5.5,2.6,6.8, -2.0,0.85,3.7],
    [4.2,1.9,6.6, -0.1,0.6,4.5],
    [3.2,1.6,6.2, -0.1,0.5,4.5],
    [4.0,1.9,6.0, 0.2,0.8,4.5],
    [3.5,1.8,6.4, -0.1,0.8,4.6],
    [3.6,1.85,6.5, -0.1,0.85,4.6],
    [6.0,2.5,7.2, 0.2,0.7,3.6],
    [3.5,1.8,6.4, -0.1,0.65,4.5],
    [8.2,2.8,7.6, 0.4,0.75,3.0],
  ];
  const c=cams[s]; camGoal.set(c[0],c[1],c[2]); lookGoal.set(c[3],c[4],c[5]);
  updateUI();
}

function lerp(a,b,t){ return a+(b-a)*t; }
function follow(x,t,dt,tau){
  if (reduceMotion) return t;
  if (Math.abs(t-x)<0.0007) return t;
  return x+(t-x)*(1-Math.exp(-dt/tau));
}
function star(i,t){
  const order=[0,2,4,1,3];
  return Math.max(0, Math.min(1, t*5 - order.indexOf(i)));
}
function hi(obj, on){
  if(!obj) return;
  if(!obj.userData.baseMat) obj.userData.baseMat = obj.material;
  obj.material = on ? M.hi : obj.userData.baseMat;
}

function getRLWorld(out){
  if (carApi.orient) {
    out.copy(carApi.rlLocal);
    carApi.orient.localToWorld(out);
  } else {
    out.set(0.4, 0.33, 4.8);
  }
  return out;
}

function updateScene(dt){
  for (const k of Object.keys(target)){
    if (k==='step') continue;
    pose[k] = follow(pose[k], target[k], dt, (k==='spareOn'||k==='flatOff')?0.38:0.26);
  }

  // Hazards on tail lamps (+ optional headlamps flash)
  const blinkOn = pose.haz > 0.55;
  const blink = blinkOn ? (0.45 + 1.55*Math.max(0, Math.sin(performance.now()*0.013))) : 0.15;
  for (const lamp of carApi.tailLamps){
    if (lamp.material) {
      if (!lamp.material.emissive) lamp.material.emissive = new THREE.Color(0xff2200);
      lamp.material.emissive.setHex(blinkOn ? 0xff2a00 : 0xff1800);
      lamp.material.emissiveIntensity = blinkOn ? blink : 1.2;
    }
  }
  for (const lamp of carApi.headLamps){
    if (lamp.material) {
      if (!lamp.material.emissive) lamp.material.emissive = new THREE.Color(0xffe8c0);
      lamp.material.emissiveIntensity = blinkOn ? (1.0 + blink*0.35) : 1.35;
    }
  }

  const liftY = pose.lift * 0.42;
  bodyLift.position.y = liftY;
  if (window.__contactShadow) {
    window.__contactShadow.material.opacity = 0.9 - pose.lift * 0.35;
    window.__contactShadow.scale.set(1 + pose.lift * 0.08, 1 + pose.lift * 0.12, 1);
  }

  // Jack under point from pinch if available
  if (carApi.pinch) {
    carApi.pinch.getWorldPosition(_v);
    home.jackUnder.set(_v.x, 0.05, _v.z);
  }
  getRLWorld(_v);
  home.wrenchWheel.set(_v.x + 0.45, 0.32 + liftY*(1-pose.flatOff), _v.z + 0.25);
  home.flatGround.set(_v.x - 0.1, TIRE_R, _v.z + 1.2);

  // RL wheel: hide when removed; procedural flat appears on ground
  if (carApi.rlWheelGroup) {
    carApi.rlWheelGroup.visible = pose.flatOff < 0.2 && pose.spareOn < 0.45;
  }
  if (pose.flatOff >= 0.2) {
    flatHold.visible = true;
    const dest = pose.step >= 9 ? home.flatStore : home.flatGround;
    if (flatHold.position.lengthSq() < 0.01) flatHold.position.copy(dest);
    flatHold.position.lerp(dest, reduceMotion?1:1-Math.exp(-dt/0.32));
    if (pose.step >= 9) flatHold.rotation.x = follow(flatHold.rotation.x, Math.PI/2, dt, 0.3);
    else flatHold.rotation.x = follow(flatHold.rotation.x, 0, dt, 0.3);
  } else {
    flatHold.visible = false;
  }

  if (carApi.hubStay) carApi.hubStay.visible = pose.flatOff > 0.35 && pose.spareOn < 0.45;

  flatNuts.forEach((n,i)=>{
    const loose=star(i,pose.nutsLoose), off=star(i,pose.nutsOff);
    n.position.x = 0.02 + loose*0.035 + off*0.2;
    n.visible = pose.flatOff > 0.2 && off < 0.9;
  });
  // Show nuts on RL wheel during loosen (before remove) via overlay near wrench — skip GLTF nuts

  // Mounted spare follows hub
  if (pose.spareOn > 0.35 && carApi.orient) {
    if (mounted.parent !== carApi.orient) {
      carApi.orient.add(mounted);
      mounted.position.copy(carApi.rlLocal);
    }
    mounted.visible = true;
    mounted.scale.setScalar(Math.max(0.01, Math.min(1, (pose.spareOn-0.3)/0.5)));
  } else {
    mounted.visible = false;
  }
  if (pose.step >= 9) { mounted.visible = true; mounted.scale.setScalar(1); }
  mountedNuts.forEach((n,i)=>{
    n.position.x = 0.02 + (pose.step>=6 && pose.step<8 ? star(i,pose.nutsLoose)*0.04 : 0);
    n.visible = pose.spareOn > 0.45;
  });

  // Spare stand
  if (pose.spareOn > 0.25) {
    spareStand.visible = pose.spareOn < 0.8;
    getRLWorld(_v); _v.y = TIRE_R + liftY;
    spareStand.position.lerpVectors(home.spare, _v, Math.min(1, pose.spareOn/0.55));
  } else if (pose.toolsOut > 0.4) {
    spareStand.visible = true;
    spareStand.position.lerp(home.spare, reduceMotion?1:1-Math.exp(-dt/0.3));
    spareStand.scale.setScalar(1);
  } else {
    spareStand.visible = pose.step < 1;
    spareStand.position.lerp(home.spareTrunk, reduceMotion?1:1-Math.exp(-dt/0.3));
    spareStand.scale.setScalar(0.7);
  }
  if (pose.step >= 9) spareStand.visible = false;

  // Jack
  if (pose.toolsOut < 0.35 && pose.step < 3) {
    jack.position.lerp(pose.toolsOut>0.15 ? home.jackSide : home.jackTrunk, reduceMotion?1:1-Math.exp(-dt/0.28));
  } else {
    jack.position.lerpVectors(home.jackSide, home.jackUnder, pose.jackUnder);
  }
  if (pose.step >= 7 && pose.jackUnder < 0.15) jack.position.lerp(home.jackSide, 0.15);
  if (pose.step >= 9) jack.position.lerp(home.jackTrunk, reduceMotion?1:1-Math.exp(-dt/0.3));
  const ext = pose.jackH;
  jackArmL.scale.y = 0.55 + ext*1.05;
  jackArmR.scale.y = 0.55 + ext*1.05;
  jackArmL.position.y = 0.12 + ext*0.22;
  jackArmR.position.y = 0.12 + ext*0.22;
  jackArmL.rotation.z = 0.6 - ext*0.5;
  jackArmR.rotation.z = -0.6 + ext*0.5;
  jackSaddle.position.y = 0.26 + ext*0.4;
  jack.visible = !(pose.step>=9 && pose.toolsOut<0.2);

  if (pose.step >= 9 || (pose.toolsOut < 0.3 && pose.step < 2)) {
    wrench.position.lerp(home.wrenchTrunk, reduceMotion?1:1-Math.exp(-dt/0.28));
  } else {
    wrench.position.lerpVectors(home.wrenchSide, home.wrenchWheel, pose.wrenchAt);
  }
  wrench.rotation.y = pose.wrenchAt*0.5 + ((pose.step===2||pose.step===8)? performance.now()*0.0015:0);

  chock.position.lerpVectors(home.chockAway, home.chockIn, pose.chockIn);
  chock.visible = pose.chockIn > 0.05 || pose.step === 0;
  tray.visible = pose.step <= 1 || pose.step >= 9;

  // Highlights
  hi(chockMesh,false); hi(jackSaddle,false);
  if (carApi.pinch) hi(carApi.pinch, false);
  flatNuts.forEach(n=>hi(n,false)); mountedNuts.forEach(n=>hi(n,false));
  hi(flatWheel.tire,false); hi(mountedWheel.tire,false); hi(spareWheel.tire,false);
  if (pose.step===0) hi(chockMesh,true);
  if (pose.step===1) hi(spareWheel.tire,true);
  if (pose.step===2) { hi(spareWheel.tire, false); }
  if (pose.step===3 && carApi.pinch){ hi(carApi.pinch,true); hi(jackSaddle,true); }
  if (pose.step===4) hi(jackSaddle,true);
  if (pose.step===5) hi(flatWheel.tire,true);
  if (pose.step===6) hi(mountedWheel.tire,true);
  if (pose.step===8) mountedNuts.forEach(n=>hi(n,true));

  for (const t of traffic){
    t.g.position.x += t.spd*dt;
    if (t.g.position.x > 65) t.g.position.x = -65;
  }

  if (!userOrbit) {
    camera.position.x = follow(camera.position.x, camGoal.x, dt, 0.9);
    camera.position.y = follow(camera.position.y, camGoal.y, dt, 0.9);
    camera.position.z = follow(camera.position.z, camGoal.z, dt, 0.9);
    controls.target.x = follow(controls.target.x, lookGoal.x, dt, 0.75);
    controls.target.y = follow(controls.target.y, lookGoal.y, dt, 0.75);
    controls.target.z = follow(controls.target.z, lookGoal.z, dt, 0.75);
  }
}

let userOrbit=false;
controls.addEventListener('start', ()=>{ userOrbit=true; });
let orbitTimer=0;
controls.addEventListener('end', ()=>{ clearTimeout(orbitTimer); orbitTimer=setTimeout(()=>{ userOrbit=false; }, 4500); });

const stepName=document.getElementById('stepName');
const stepCount=document.getElementById('stepCount');
const hintText=document.getElementById('hintText');
const safetyText=document.getElementById('safetyText');
const btnPrev=document.getElementById('btnPrev');
const btnNext=document.getElementById('btnNext');
const dotsEl=document.getElementById('dots');
STEPS.forEach((_,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='dot';
  b.setAttribute('aria-label','步骤 '+i); b.addEventListener('click',()=>go(i)); dotsEl.appendChild(b);
});
function updateUI(){
  const st=STEPS[pose.step];
  stepName.textContent=st.name; stepCount.textContent=pose.step+' / 9';
  hintText.textContent=st.text;
  safetyText.innerHTML='<strong>安全提示：</strong>'+st.safety;
  btnPrev.disabled=pose.step<=0; btnNext.disabled=pose.step>=9;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===pose.step));
  document.body.dataset.step=String(pose.step);
}
function go(n){ userOrbit=false; applyStep(n); }
btnPrev.onclick=()=>go(pose.step-1);
btnNext.onclick=()=>go(pose.step+1);
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();go(pose.step-1);}
  else if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(pose.step+1);}
  else if(e.key==='Home'){e.preventDefault();go(0);}
  else if(e.key==='End'){e.preventDefault();go(9);}
});
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight,false);
});

const params=new URLSearchParams(location.search);
const bootStep=Math.max(0,Math.min(9,parseInt(params.get('step')||'0',10)||0));
const snapBoot=params.has('snap');

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if (carApi.ready) updateScene(dt);
  controls.update(); renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

loadCar().then(()=>{
  // Diagonal chock near front-right wheel world pos
  let frNode = null;
  carApi.orient.traverse(o => { if (o.name === 'WheelFrontR') frNode = o; });
  if (frNode) {
    const fr = new THREE.Vector3();
    frNode.getWorldPosition(fr);
    home.chockIn.set(fr.x - 0.35, 0.02, fr.z - 0.25);
  }
  applyStep(bootStep);
  if (snapBoot){
    for (const k of Object.keys(target)) if (k!=='step') pose[k]=target[k];
    camera.position.copy(camGoal); controls.target.copy(lookGoal); controls.update();
    updateScene(10);
  }
  document.getElementById('loading').classList.add('hide');
  setTimeout(()=>{ document.getElementById('loading').style.display='none'; }, 400);
  window.__ready__ = true;
  window.__camera = camera;
  window.__jack = jack;
  window.__spareStand = spareStand;
  window.__flatHold = flatHold;
  window.__wrench = wrench;
  window.__controls = controls;
  window.__renderer = renderer;
  window.__scene = scene;
}).catch(err=>{
  console.error(err);
  document.getElementById('loading').textContent = '轿车模型加载失败：'+err.message;
});

window.__setStep__ = (n)=>{
  applyStep(n);
  for (const k of Object.keys(target)) if (k!=='step') pose[k]=target[k];
  camera.position.copy(camGoal); controls.target.copy(lookGoal);
  updateScene(10); controls.update(); renderer.render(scene,camera);
};
</script>
</body>
</html>
