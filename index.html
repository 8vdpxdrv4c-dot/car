function enhanceMaterials(root){
  root.traverse(obj => {
    if (!obj.isMesh) return;
    obj.castShadow = true; obj.receiveShadow = true;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const mat of mats) {
      if (!mat) continue;
      const n = (mat.name || '').toLowerCase();
      if (n.includes('paint')) {
        mat.envMapIntensity = Math.max(mat.envMapIntensity || 1, 1.45);
        if ('clearcoat' in mat) { mat.clearcoat = Math.max(mat.clearcoat || 0, 1); mat.clearcoatRoughness = Math.min(mat.clearcoatRoughness ?? 0.1, 0.08); }
        if ('roughness' in mat) mat.roughness = Math.min(mat.roughness ?? 0.3, 0.28);
      } else if (n.includes('glass')) {
        mat.envMapIntensity = Math.max(mat.envMapIntensity || 1, 1.8);
      }
    }
  });
}
async function applyGraphiteVariant(gltf){
  const parser = gltf.parser;
  const paint1 = await parser.getDependency('material', 23);
  const paint2 = await parser.getDependency('material', 25);
  const interior3 = await parser.getDependency('material', 27);
  gltf.scene.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    const n = obj.material.name || '';
    if (n.includes('Paint 1')) obj.material = paint1;
    else if (n.includes('Paint 2')) obj.material = paint2;
    else if (n.includes('Interior 3')) obj.material = interior3;
  });
}

function quad(a, b, c, t, out){
  const u = 1-t;
  out.set(0,0,0);
  out.addScaledVector(a, u*u);
  out.addScaledVector(b, 2*u*t);
  out.addScaledVector(c, t*t);
  return out;
}

function measureWheel(wheel, axleSign){
  const inv = new THREE.Matrix4().copy(wheel.matrixWorld).invert();
  const m = new THREE.Matrix4();
  const p = new THREE.Vector3();
  let radial = 0;
  let face = 0;
  let rimFace = 0;
  let axialMin = Infinity;
  let axialMax = -Infinity;
  wheel.traverse(c => {
    if (!c.isMesh || !c.geometry || /Brake/i.test(c.name || '')) return;
    const g = c.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    const bb = g.boundingBox;
    m.copy(inv).multiply(c.matrixWorld);
    const mid = (a, b) => (a + b) * 0.5;
    const samples = [
      [mid(bb.min.x, bb.max.x), bb.max.y, mid(bb.min.z, bb.max.z)],
      [mid(bb.min.x, bb.max.x), bb.min.y, mid(bb.min.z, bb.max.z)],
      [mid(bb.min.x, bb.max.x), mid(bb.min.y, bb.max.y), bb.max.z],
      [mid(bb.min.x, bb.max.x), mid(bb.min.y, bb.max.y), bb.min.z],
      [bb.max.x, mid(bb.min.y, bb.max.y), mid(bb.min.z, bb.max.z)],
      [bb.min.x, mid(bb.min.y, bb.max.y), mid(bb.min.z, bb.max.z)],
    ];
    for (const s of samples) {
      p.set(s[0], s[1], s[2]).applyMatrix4(m);
      radial = Math.max(radial, Math.hypot(p.y, p.z));
      const along = axleSign * p.x;
      face = Math.max(face, along);
      axialMin = Math.min(axialMin, along);
      axialMax = Math.max(axialMax, along);
      if (/Rim/i.test(c.name || '')) rimFace = Math.max(rimFace, along);
    }
  });
  if (!isFinite(axialMin)) { axialMin = -0.14; axialMax = 0.14; }
  return { radial, face: (rimFace || face) + 0.012, axialMin, axialMax };
}

async function loadCar(){

  orient.name = 'carOrient';
  orient.rotation.y = -Math.PI/2;
  orient.add(model);
  bodyLift.add(orient);
  carApi.orient = orient;
  model.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(orient);
  orient.position.y -= bounds.min.y;
  orient.updateMatrixWorld(true);

  let wheel = null, front = null;
  model.traverse(obj => {
    if (obj.name === 'WheelRearL') wheel = obj;
    if (obj.name === 'WheelFrontL') front = obj;
    if (/Taillight|Turnsignal|Brakelight/i.test(obj.name || '')) {
      obj.traverse(c => { if (c.isMesh && !carApi.tailLamps.includes(c)) carApi.tailLamps.push(c); });
      if (obj.isMesh && !carApi.tailLamps.includes(obj)) carApi.tailLamps.push(obj);
    }
  });
  carApi.wheel = wheel;

  if (wheel) {
    const origin = new THREE.Vector3();
    const plusX = new THREE.Vector3(0.25, 0, 0);
    wheel.updateWorldMatrix(true, true);
    wheel.localToWorld(origin);
    wheel.localToWorld(plusX);
    plusX.sub(origin);
    saved.axleSign = plusX.z >= 0 ? 1 : -1;
    // Radius from the tread (bbox face centers in wheel-local YZ), not the
    // world AABB — a tilted bounding box overestimates the rolling radius.
    const measured = measureWheel(wheel, saved.axleSign);
    saved.radius = measured.radial || 0.384;
    saved.nutFace = measured.face || 0.14;
    saved.tireWidth = Math.min(0.34, Math.max(0.22, (measured.axialMax - measured.axialMin) || 0.28));
    saved.tireCenter = ((measured.axialMax + measured.axialMin) * 0.5) || 0;
    saved.axleWorld.copy(plusX).normalize();
    // Positive tireCenter is outboard (toward the curb), not raw local +X.
    saved.axleOut.copy(saved.axleWorld).multiplyScalar(saved.axleSign || 1);
    wheel.getWorldPosition(_v);
    // Sit the tread on y=0. The mesh AABB can hang below the rubber.
    orient.position.y -= (_v.y - saved.radius);
    orient.updateMatrixWorld(true);
    wheel.getWorldPosition(_v);
    saved.hubLocal.copy(_v); orient.worldToLocal(saved.hubLocal);
    saved.wheelRestPos.copy(wheel.position);
    saved.wheelRestQuat.copy(wheel.quaternion);
    buildHubNuts(wheel);
  }
  if (front) {
    front.getWorldPosition(_v);
    saved.frontLocal.copy(_v); orient.worldToLocal(saved.frontLocal);
  }
  // Nose is orient-local +Z; curb / outward is orient-local +X.
  saved.pinchLocal.set(
    saved.hubLocal.x - 0.02,
    Math.min(0.22, saved.hubLocal.y - 0.16),
    saved.hubLocal.z + 0.42
  );
  orient.add(pinchMark);
  pinchMark.position.copy(saved.pinchLocal);
  orient.add(hubStay);
  hubStay.position.copy(saved.hubLocal);

  const carBox = new THREE.Box3().setFromObject(orient);
  // World +X is the rear bumper after the yaw. Keep that point in orient space.
  _v.set(carBox.max.x - 0.02, carBox.min.y + 0.52, carBox.getCenter(new THREE.Vector3()).z);
  orient.worldToLocal(_v);
  saved.trunkLocal.copy(_v);

  model.traverse(obj => {
    if (!/license/i.test(obj.name || '')) return;
    obj.traverse(c => {
      if (!c.isMesh) return;
      c.material = M.plate.clone();
      c.material.polygonOffset = true;
      c.material.polygonOffsetFactor = -1;
    });
  });
  function addPlate(zSign){
    const g = new THREE.Group();
    box(0.52, 0.145, 0.012, new THREE.MeshStandardMaterial({ color:0xb7bec6, metalness:0.85, roughness:0.25 }), 0, 0, 0, g).castShadow = false;
    const face = box(0.48, 0.125, 0.01, M.plate.clone(), 0, 0, 0.012, g);

    model.add(g);
    const b = new THREE.Box3().setFromObject(model);
    const z = zSign < 0 ? b.min.z + 0.02 : b.max.z - 0.02;
    g.position.set(0, b.min.y + 0.46, z);
    if (zSign > 0) g.rotation.y = Math.PI;
  }
  addPlate(-1); addPlate(1);

  for (const lamp of carApi.tailLamps) {
    const mats = Array.isArray(lamp.material) ? lamp.material : [lamp.material];
    for (const m of mats) {
      if (!m || m.userData.hazardReady) continue;
      if (!m.emissive) m.emissive = new THREE.Color(0x000000);
      m.userData.baseEm = m.emissive.clone();
      m.userData.baseEi = m.emissiveIntensity || 0;
      m.userData.hazardReady = true;

    new THREE.Box3().setFromObject(orient).getCenter(mid);
    world.userData.blob.position.set(mid.x, 0.012, mid.z);
  }

function channelEase(name, u){
  const s = smooth, c = clamp01;
  if (step === 2 && name === 'wrench') return s(c(u / 0.3));
  if (step === 2 && name === 'loose') return s(c((u - 0.16) / 0.84));
  if (step === 5 && name === 'wrench') return s(c(u / 0.26));
  if (step === 5 && name === 'off') return s(c((u - 0.06) / 0.36));
  if (step === 5 && name === 'flat') return s(c((u - 0.4) / 0.6));
  if (step === 6 && name === 'spare') return s(c(u / 0.72));
  if (step === 6 && (name === 'off' || name === 'loose')) return s(c((u - 0.42) / 0.58));
  if (step === 8 && name === 'wrench') return s(c(u / 0.28));
  if (step === 8 && name === 'loose') return s(c((u - 0.14) / 0.86));
  return s(c(u));
}

function distScale(){

  if (a < 0.72) return 1.42;
  if (a < 1.02) return 1.16;

}

function computeShot(n){
  refreshAnchors();
  const hub = anchors.hub, front = anchors.front, pinch = anchors.pinch, trunk = anchors.trunk;
  const sideX = hub.x * 0.48 + front.x * 0.52;
  const sideZ = hub.z * 0.5 + front.z * 0.5;
  const workX = hub.x * 0.62 + pinch.x * 0.38;
  const workZ = hub.z * 0.55 + pinch.z * 0.45;
  const points = [
    { x:sideX, y:0.55, z:sideZ, back:-0.1, up:1.22, out:4.05, ly:0.0 },
    { x:hub.x + 0.62, y:0.36, z:hub.z + 0.08, back:1.15, up:0.78, out:1.7, ly:-0.02 },
    { x:hub.x, y:hub.y, z:hub.z, back:0.16, up:0.18, out:1.72, ly:-0.02 },
    { x:pinch.x, y:pinch.y, z:pinch.z, back:0.0, up:0.28, out:1.55, ly:0.0 },
    { x:workX, y:(hub.y + pinch.y) * 0.5, z:workZ, back:0.2, up:0.55, out:2.05, ly:0.02 },
    { x:hub.x, y:hub.y, z:hub.z, back:0.02, up:0.26, out:1.85, ly:0.0 },
    { x:hub.x, y:hub.y, z:hub.z, back:0.08, up:0.24, out:1.72, ly:0.0 },
    { x:workX, y:Math.max(0.4, pinch.y), z:workZ, back:0.16, up:0.5, out:1.95, ly:0.0 },
    { x:hub.x, y:hub.y, z:hub.z, back:0.02, up:0.12, out:1.32, ly:-0.02 },
    { x:hub.x * 0.7 + trunk.x * 0.3, y:0.62, z:hub.z * 0.8 + trunk.z * 0.2, back:1.05, up:0.92, out:2.05, ly:0.02 },
  ];
  // The temps above alias _a/_b/_c while points[] is being filled — values are copied into plain objects immediately, OK.
  const spec = points[n];
  const s = distScale();
  _shotPos.set(spec.x + spec.back * s, spec.y + spec.up * Math.sqrt(s), spec.z + spec.out * s);
  _shotPos.y = Math.max(0.32, _shotPos.y);
  _shotLook.set(spec.x, spec.y + spec.ly, spec.z);
  return { pos:_shotPos, look:_shotLook };
}

function aim(n, snap){
  // Frame the pose this step ends on (lifted or lowered), then let the demo play into it.
  const prevY = bodyLift.position.y;
  if (carApi.orient) {
    bodyLift.position.y = to.lift * LIFT;
    bodyLift.updateMatrixWorld(true);
  }
  const shot = computeShot(n);
  bodyLift.position.y = prevY;
  guidedPos.copy(shot.pos);
  guidedLook.copy(shot.look);
  if (snap || reduceMotion) {
    camera.position.copy(guidedPos);
    lookNow.copy(guidedLook);
    camera.lookAt(lookNow);
    camT = 1;
  } else {
    camFromPos.copy(camera.position);
    camFromLook.copy(lookNow);
    camT = 0;
  }
}

function glow(mesh, on){

    m.userData.baseEm = m.emissive.clone();

  if (on) { m.emissive.setHex(0xff9a1a); m.emissiveIntensity = 0.7; }

function updateRig(dt, now){
  const u = reduceMotion ? 1 : demoT;
  for (const k of KEYS) {
    const e = channelEase(k, u);
    shown[k] = from[k] + (to[k] - from[k]) * e;
  }
  const P = shown;
  bodyLift.position.y = P.lift * LIFT;
  if (world.userData.blob) world.userData.blob.material.opacity = 0.85 - P.lift * 0.35;
  bodyLift.updateMatrixWorld(true);
  refreshAnchors();

  const blink = P.haz > 0.45 && Math.sin(now * 0.009) > -0.15;
  const seen = new Set();
  for (const lamp of carApi.tailLamps) {
    const mats = Array.isArray(lamp.material) ? lamp.material : [lamp.material];
    for (const m of mats) {
      if (!m || !m.userData.hazardReady || seen.has(m)) continue;
      seen.add(m);
      if (P.haz > 0.45) {
        m.emissive.setHex(m.userData.amber ? 0xffb000 : 0xff2a00);
        // Stay visibly lit, and pulse brighter, so the double-flash reads in daylight.
        m.emissiveIntensity = blink ? 12 : 3.2;
      } else {
        m.emissive.copy(m.userData.baseEm);
        m.emissiveIntensity = m.userData.baseEi;
      }
    }
  }

  const R = anchors.radius;
  const hub = anchors.hub, front = anchors.front, pinch = anchors.pinch, trunk = anchors.trunk;
  const chockIn = _a.set(front.x - R - 0.04, 0.04, front.z);
  const chockAway = _b.set(front.x - 0.05, 0.04, front.z + 1.05);
  chock.position.lerpVectors(chockAway, chockIn, P.chock);
  chock.rotation.y = 0;

  // Lay the spare and the flat behind the working wheel, not between the lens and the hub.
  const trunkSpare = _c.set(trunk.x + 0.08, R, trunk.z + 0.72);
  const laySpare = new THREE.Vector3(hub.x + 0.95, R, hub.z + 0.18);
  const layFlat = new THREE.Vector3(hub.x + 0.9, R, hub.z + 0.28);
  const trunkFlat = new THREE.Vector3(trunk.x + 0.05, R, trunk.z + 0.95);
  const layJack = new THREE.Vector3(pinch.x + 0.28, 0, pinch.z + 0.7);
  const underJack = new THREE.Vector3(pinch.x, 0, pinch.z);
  const trunkJack = new THREE.Vector3(trunk.x - 0.28, 0.02, trunk.z + 0.72);
  const layWrench = new THREE.Vector3(hub.x + 0.42, 0.04, hub.z + 0.62);
  const trunkWrench = new THREE.Vector3(trunk.x + 0.22, 0.04, trunk.z + 0.62);

  if (P.jackU > 0.001) jack.position.lerpVectors(layJack, underJack, P.jackU);
  else jack.position.lerpVectors(trunkJack, layJack, P.tools);
  const collapsed = Math.max(0.12, Math.min(pinch.y - 0.035, 0.18));
  layoutJack(collapsed + P.jackH * Math.max(0, pinch.y - collapsed));

  const wheel = carApi.wheel;

      wheel.position.copy(saved.wheelRestPos);
      wheel.quaternion.copy(saved.wheelRestQuat);
    } else if (P.flat > 0.999) {
      const tuck = 1 - P.tools;
      _bez.copy(layFlat).lerp(trunkFlat, tuck);
      setWorldPos(wheel, _bez);
    } else {
      const ctrl = _b.set(hub.x + 0.12, hub.y + 0.02, hub.z + 0.72);
      quad(hub, ctrl, layFlat, P.flat, _bez);
      setWorldPos(wheel, _bez);
    }
    const ext = saved.nutFace + P.loose * 0.028 + P.off * 0.16;
    placeHubNuts(ext);
    for (const n of hubNuts) {
      n.visible = P.flat < 0.25 && P.off < 0.92;
      n.material.opacity = 1;
      n.material.transparent = P.off > 0.7;
      if (P.off > 0.7) n.material.opacity = clamp01(1 - (P.off - 0.7) / 0.3);
    }
    // A failed slide must not leave the original tire filling the hub.
    // Once it has actually left the hub, keep it visible on the ground / at the trunk.
    wheel.getWorldPosition(_v);
    const stillOnHub = _v.distanceTo(hub) < Math.max(0.08, R * 0.35);
    wheel.visible = !(P.flat > 0.5 && stillOnHub);
  }

  hubStay.visible = P.flat > 0.45 && P.spare < 0.82;

  // Seat on the live hub, shifted along the axle onto the original tire's center.
  _seat.copy(hub).addScaledVector(saved.axleOut, saved.tireCenter || 0);
  if (P.spare > 0.001) {
    const ctrl = _b.set(hub.x + 0.28, Math.max(hub.y, R) + 0.05, hub.z + 0.68);
    if (P.spare > 0.985) {
      spare.position.copy(_seat);
    } else {
      quad(laySpare, ctrl, _seat, P.spare, spare.position);
      if (P.spare > 0.8) spare.position.lerp(_seat, smooth((P.spare - 0.8) / 0.185));
    }
  } else {
    spare.position.lerpVectors(trunkSpare, laySpare, P.tools);
  }
  if (saved.axleOut.lengthSq() > 0.5) _spareQuat.setFromUnitVectors(_axleZ, saved.axleOut);
  else _spareQuat.identity();
  spare.quaternion.copy(_spareQuat);
  // Hand-tight while loose is still up (step 6); seated flush once torqued (step 8).
  placeSpareNuts(P.off * 0.09 + P.loose * 0.045);
  for (const n of spare.userData.nuts) n.visible = P.spare > 0.55;

  // Wrench: on the active nut during loosen / remove / final torque, otherwise with the tools.
  let nutSet = hubNuts;
  if (step >= 6) nutSet = spare.userData.nuts;
  const workKey = (step === 8) ? 'loose' : (step === 5 ? 'off' : 'loose');
  const a0 = from[workKey], b0 = to[workKey];
  const progress = Math.abs(b0 - a0) < 1e-3 ? 1 : clamp01((P[workKey] - a0) / (b0 - a0));
  const order = [0, 2, 4, 1, 3];
  const nutI = order[Math.min(4, Math.floor(progress * 5))];
  const nut = nutSet[nutI] || nutSet[0];
  const atWheel = P.wrench > 0.2 && nut && nut.visible !== false;
  if (atWheel) nut.getWorldPosition(_v);
  const rest = _c.copy(trunkWrench).lerp(layWrench, P.tools);
  const desired = _a.copy(atWheel ? _v : rest);
  if (atWheel) desired.z += 0.02;
  if (snapWrench) { wrenchHold.copy(desired); snapWrench = false; }
  else wrenchHold.lerp(desired, 1 - Math.exp(-dt / 0.08));
  wrench.position.copy(wrenchHold);
  const spin = (step === 2 || step === 5 || step === 8) ? progress * Math.PI * 2.2 : 0;
  const qWork = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, spin));
  wrench.quaternion.copy(qFlat).slerp(qWork, clamp01(P.wrench));

  glow(pinchMark, step === 3);
  glow(jackSaddle, step === 3 || step === 4 || step === 7);
  glow(chockBody, false);
  for (const n of hubNuts) glow(n, false);
  for (const n of spare.userData.nuts) glow(n, false);
  if ((step === 2 || step === 5) && hubNuts[nutI]) glow(hubNuts[nutI], true);
  if (step === 8 && spare.userData.nuts[nutI]) glow(spare.userData.nuts[nutI], true);

  const ringScale = [0.26, 0.34, 0.18, 0.14, 0.16, 0.22, 0.3, 0.15, 0.18, 0.28][step];
  let ringAt = hub;
  if (step === 0) ringAt = chock.position;
  else if (step === 1 || step === 6 || step === 9) ringAt = P.spare > 0.35 || step === 1 ? spare.position : hub;
  else if (step === 3 || step === 7) { jackSaddle.getWorldPosition(_v); ringAt = step === 3 ? pinch : _v; }
  else if (step === 4) { jackSaddle.getWorldPosition(_v); ringAt = _v; }
  focusRing.position.copy(ringAt);
  focusRing.scale.setScalar(ringScale);
  focusRing.material.opacity = 0.38 + 0.14 * Math.sin(now * 0.006);

  for (const t of traffic) {
    t.g.position.x += t.spd * dt;
    if (t.g.position.x > 70) t.g.position.x = -70;
  }
}

function updateCamera(dt){
  if (orbitOn) { controls.update(); return; }
  if (camT < 1) {
    camT = Math.min(1, camT + dt / CAM_SEC);
    const e = smooth(camT);
    camera.position.lerpVectors(camFromPos, guidedPos, e);
    lookNow.lerpVectors(camFromLook, guidedLook, e);
  }
  camera.lookAt(lookNow);
  focusRing.lookAt(camera.position);
}

const stepNameEl = document.getElementById('stepName');
const stepCountEl = document.getElementById('stepCount');
const actionEl = document.getElementById('actionText');
const safetyEl = document.getElementById('safetyText');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnOrbit = document.getElementById('btnOrbit');
const orbitHint = document.getElementById('orbitHint');
const bar = document.getElementById('bar');
const live = document.getElementById('live');

STEPS.forEach((st, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'seg';
  b.textContent = String(i + 1);
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-label', `第 ${i+1} 步 ${st.name}`);
  b.addEventListener('click', () => go(i));
  bar.appendChild(b);
});

function updateUI(){
  const st = STEPS[step];
  stepNameEl.textContent = st.name;
  stepCountEl.textContent = `${step+1} / ${STEPS.length}`;
  actionEl.textContent = st.action;
  safetyEl.innerHTML = `<b>安全</b>${st.safety}`;
  btnPrev.disabled = step <= 0;
  btnNext.disabled = step >= STEPS.length - 1;
  [...bar.children].forEach((el, i) => {
    el.classList.toggle('on', i === step);
    el.classList.toggle('done', i < step);
    el.setAttribute('aria-selected', i === step ? 'true' : 'false');
  });
  live.textContent = `第 ${step+1} 步，${st.name}。${st.action}`;
  document.body.dataset.step = String(step);
}

function setOrbit(on){
  orbitOn = on;
  controls.enabled = on;
  document.body.classList.toggle('orbit', on);
  btnOrbit.setAttribute('aria-pressed', on ? 'true' : 'false');
  btnOrbit.textContent = on ? '回到引导' : '自由看一眼';
  orbitHint.hidden = !on;
  if (on) {
    controls.target.copy(lookNow);
    controls.update();
  } else {
    aim(step, false);
  }
  applyViewOffset();
}

function go(n, opts = {}){
  n = Math.max(0, Math.min(STEPS.length - 1, n|0));
  if (orbitOn) {
    orbitOn = false;
    controls.enabled = false;
    document.body.classList.remove('orbit');
    btnOrbit.setAttribute('aria-pressed', 'false');
    btnOrbit.textContent = '自由看一眼';
    orbitHint.hidden = true;
  }
  step = n;
  from = n === 0 ? { ...ZERO } : rowToMap(END[n - 1]);
  to = rowToMap(END[n]);
  if (opts.snapProps || reduceMotion) {
    demoT = 1;
    shown = { ...to };
  } else {
    demoT = 0;
    shown = { ...from };
  }
  snapWrench = true;
  updateUI();
  if (carApi.ready) aim(n, !!opts.snapCam || reduceMotion);
}

btnPrev.addEventListener('click', () => go(step - 1));
btnNext.addEventListener('click', () => go(step + 1));
btnOrbit.addEventListener('click', () => setOrbit(!orbitOn));
addEventListener('keydown', (e) => {
  if (e.target && e.target.closest && e.target.closest('button') && e.key === ' ') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(step - 1); }
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(step + 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(STEPS.length - 1); }
});
addEventListener('resize', () => {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  applyViewOffset();
  if (carApi.ready && !orbitOn) aim(step, camT >= 1);
});

applyViewOffset();
updateUI();

const params = new URLSearchParams(location.search);
const bootStep = Math.max(0, Math.min(STEPS.length - 1, parseInt(params.get('step') || '0', 10) || 0));
const snapBoot = params.has('snap');

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (carApi.ready) {
    if (!reduceMotion && demoT < 1) demoT = Math.min(1, demoT + dt / DEMO_SEC);
    updateRig(dt, now);
    updateCamera(dt);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

loadCar().then(() => {
  go(bootStep, { snapProps: snapBoot, snapCam: true });
  updateRig(1/60, performance.now());
  updateCamera(0);
  renderer.render(scene, camera);
  const loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(() => { loading.style.display = 'none'; }, 400);
  window.__ready__ = true;
}).catch(err => {
  console.error(err);
  document.getElementById('loading').textContent = '轿车模型加载失败：' + (err && err.message ? err.message : err);
});

function project(v){
  const p = v.clone().project(camera);
  return [+p.x.toFixed(3), +p.y.toFixed(3)];
}
window.__frameInfo = () => ({
  step,
  orbit: orbitOn,
  cam: camera.position.toArray().map(n => +n.toFixed(3)),
  look: lookNow.toArray().map(n => +n.toFixed(3)),
  hub: anchors.hub.toArray().map(n => +n.toFixed(3)),
  pinch: anchors.pinch.toArray().map(n => +n.toFixed(3)),
  trunk: anchors.trunk.toArray().map(n => +n.toFixed(3)),
  wheel: carApi.wheel ? carApi.wheel.getWorldPosition(new THREE.Vector3()).toArray().map(n => +n.toFixed(3)) : null,
  hubNdc: project(anchors.hub),
  pinchNdc: project(anchors.pinch),
  frontNdc: project(anchors.front),
  chockNdc: project(chock.position),
  spareNdc: project(spare.position),
  anchorsLocal: {
    hub: saved.hubLocal.toArray(),
    front: saved.frontLocal.toArray(),
    pinch: saved.pinchLocal.toArray(),
    radius: saved.radius,
    axleSign: saved.axleSign,
    nutFace: saved.nutFace,
  },
});
window.__setStep__ = (n, snap = true) => {
  go(n, { snapProps: !!snap, snapCam: !!snap });
  updateRig(1/60, performance.now());
  updateCamera(0);
  renderer.render(scene, camera);
};
window.__go = go;
</script>
</body>
</html>
